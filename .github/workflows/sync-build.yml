name: Sync & Build Clipboard Fix

# fork 后放入 .github/workflows/sync-build.yml
# 定时拉取官方最新代码 + 重新打剪贴板补丁 + 构建 + 签名 + 上传 APK
# 不依赖本机；补丁冲突时会失败，需要人工重做补丁

on:
  schedule:
    - cron: '0 2 * * *'        # 每天 UTC 02:00（北京时间 10:00），可改
  workflow_dispatch:             # 也可以在 Actions 页手动触发

permissions:
  contents: write

jobs:
  sync-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork（含 patches 目录与本 workflow）
        uses: actions/checkout@v7

      - name: 备份补丁文件
        run: |
          mkdir -p /tmp/patches
          cp patches/*.patch /tmp/patches/ 2>/dev/null || true

      - name: 拉取官方最新代码
        run: |
          git remote add upstream https://github.com/gujjwal00/avnc.git || true
          git fetch upstream
          git checkout upstream/master          # detached HEAD，不碰 fork 分支
          git submodule update --init --recursive

      - name: 打剪贴板补丁
        run: |
          mkdir -p patches
          cp /tmp/patches/*.patch patches/ 2>/dev/null || true
          git apply patches/clipboard-utf8-avnc.patch
          git -C extern/libvncserver apply ../../patches/clipboard-utf8-libvncserver.patch

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 构建（assembleCi，包名 com.gaurav.avnc.ci 天然与官方共存）
        run: |
          chmod +x gradlew
          ./gradlew assembleCi

      - name: 用固定 debug keystore 签名
        working-directory: ./app/build/outputs/apk/ci/
        run: |
          echo "" | base64 --decode > debug.keystore
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android \
            --in app-ci-unsigned.apk --out avnc-clipboard-fix.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: avnc-clipboard-fix
          path: app/build/outputs/apk/ci/avnc-clipboard-fix.apk
